 <script>
 
/*----------------------------------------------------------*/
/* BACKGROUND CORE UPDATE                                   */
/*----------------------------------------------------------*/

function refreshCoreInBackground()
{
    if (!navigator.serviceWorker)
    {
        return;
    }

    navigator.serviceWorker.ready
        .then(registration =>
        {
            if (!registration.active)
            {
                return;
            }

            registration.active.postMessage({
                type: "UPDATE_CORE"
            });

            console.log(
                "Song2HTML: background core update requested"
            );
        })
        .catch(error =>
        {
            console.warn(
                "Song2HTML: background core update failed",
                error
            );
        });
}

 </script>
